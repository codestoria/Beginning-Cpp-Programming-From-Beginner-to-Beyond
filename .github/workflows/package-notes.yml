name: Package Notes Zip

on:
  push:
    branches: [ "main" ]
    paths:
      - "cpp-notes/**"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: package-notes
  cancel-in-progress: true

jobs:
  build-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create zip archive of notes
        run: zip -r cpp-notes-latest.zip cpp-notes

      - name: Ensure rolling release exists
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cpp-notes-latest
          name: Latest Notes Archive
          body: "Automatically built from `cpp-notes/` on `main`."
          files: cpp-notes-latest.zip
          make_latest: false
